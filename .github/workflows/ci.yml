name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: timescale/timescaledb@sha256:b346edcdb51a1fd6020e3965e0bd1c9f3406fa6d5fbce1e28f4852587ef934e2
        env:
          POSTGRES_USER: spindle
          POSTGRES_PASSWORD: spindle
          POSTGRES_DB: spindle_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U spindle" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports: ["6379:6379"]
    env:
      TEST_DATABASE_URL: postgres://spindle:spindle@127.0.0.1:5432/spindle_test
      REDIS_URL: redis://127.0.0.1:6379/1
      RPC_URLS: http://127.0.0.1:1
      PUBLIC_RPC_URL: http://127.0.0.1:1
      IZIPAY_BASE_URL: http://127.0.0.1:1/api/v1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test ./src ./dev
      - run: cd node && bun test

  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.8.6
      - run: forge build
        working-directory: contracts
      - run: forge test --no-match-path 'test/fork/*'
        working-directory: contracts

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.8.6
      - run: pip install slither-analyzer==0.11.6 semgrep==1.183.0
      - name: Slither
        run: slither contracts --foundry-out-directory out --filter-paths 'lib/|test/|script/|src/dev/|src/mocks/' --exclude-informational --exclude-low --fail-medium
      - name: Semgrep
        run: semgrep scan --error --metrics=off --config p/default --config p/secrets --config p/typescript src node/src
      - name: Gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner
